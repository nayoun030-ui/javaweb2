spring.application.name=demo

# 4주차 MySQL 접속 정보 (기본 포트 3306, 데이터베이스 spring)
spring.datasource.url=jdbc:mysql://localhost:3306/spring?serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 비밀번호는 GitHub에 올라가지 않도록 secret.properties 에 따로 작성 (.gitignore 등록)
# secret.properties 내용 예) spring.datasource.password=내비밀번호
spring.config.import=optional:classpath:secret.properties
